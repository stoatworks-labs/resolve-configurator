[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resolve-configurator"
version = "0.1.0"
description = "Scaffold a DaVinci Resolve project (bins, timelines, media, smart-bin recipes) from a theatre/session CSV."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Allan Sargeant" }]
keywords = ["davinci-resolve", "video", "editing", "automation", "live-events"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
resolve-configure = "resolve_configurator.cli:main"

[project.gui-scripts]
resolve-configure-gui = "resolve_configurator.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
