name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e '.[dev]'
      - name: Run tests
        run: pytest -q
      - name: Dry-run end-to-end (no Resolve required)
        run: resolve-configure sample-sessions.csv --config project.example.toml --dry-run --recipe-out out
